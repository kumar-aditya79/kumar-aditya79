<svg xmlns="http://www.w3.org/2000/svg" width="517" height="587" viewBox="0 0 517 587">

<defs>

    <filter
        id="scanGlow"
        x="-50%"
        y="-500%"
        width="200%"
        height="1100%"
    >

        <feGaussianBlur
            stdDeviation="4"
            result="blur"
        />

        <feMerge>

            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>

        </feMerge>

    </filter>

</defs>


<style>

.ascii {
    font-family:
        "Cascadia Mono",
        "Consolas",
        "Courier New",
        monospace;

    font-size: 7px;
    font-weight: 500;
    letter-spacing: 0;
}


/* ==============================================
   LINE-BY-LINE REVEAL
   ============================================== */

.ascii-row {

    opacity: 0;

    animation:
        revealRow 4.0s
        linear forwards;

}


@keyframes revealRow {

    0% {
        opacity: 0;
    }

    5% {
        opacity: 0;
    }

    100% {
        opacity: 1;
    }

}


/* ==============================================
   GREEN LASER
   Runs ONLY ONCE
   ============================================== */

.scanner {

    animation:
        scanDown 4.0s
        linear forwards;

}


@keyframes scanDown {

    0% {
        transform:
            translateY(0px);

        opacity: 1;
    }

    5% {
        opacity: 1;
    }

    95% {
        opacity: 1;
    }

    100% {
        transform:
            translateY(527.0px);

        opacity: 0;
    }

}


/* ==============================================
   SCANNER GLOW
   ============================================== */

.scanner-glow {

    animation:
        scanDown 4.0s
        linear forwards;

}

</style>

