    <style>
        .ascii {
            font-family: "Courier New", monospace;
            font-size: 14px;
            font-weight: 400;
            fill: #b8b8b8;
        }

        .cursor {
            fill: #b8b8b8;
            opacity: 0.9;
        }

        @keyframes reveal {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(0);
            }
        }

        .reveal {
            animation-name: reveal;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
    </style>
    
