        "Consolas",
        "Courier New",
        monospace;

    font-size: 7px;
    font-weight: 500;
    letter-spacing: 0;
}

.row {
    opacity: 0;
    animation: typeRow 0.5s ease forwards;
}

@keyframes typeRow {

    from {
        opacity: 0;
        transform: translateX(-12px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }

}

</style>

