name: Update Contribution Heatmap

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-contributions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Fetch GitHub contributions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/fetch_contributions.py

      - name: Generate contribution heatmap
        run: |
          python scripts/render_heatmap_svg.py

      - name: Generate ASCII portrait
        run: |
          python scripts/make_ascii_svg.py

      - name: Generate info card
        run: |
          python scripts/make_info_card.py

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/contributions.json contrib-heatmap.svg

          if git diff --cached --quiet; then
            echo "No contribution changes to commit."
          else
            git commit -m "chore: update contribution heatmap"
            git push
          fi